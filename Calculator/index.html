<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Calculator</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="calculator">
    <div class="top">
  <span class="brand"> CALCULATOR</span>

  <div class="top-actions">
    <span class="status">● READY</span>

    <button id="themeToggle" class="theme-toggle" type="button">
      ☀️
    </button>
  </div>
</div>

    <section class="screen" aria-live="polite">
      <div id="previous" class="previous"></div>
      <div id="display" class="display">0</div>
    </section>
    <div class="history-section">
  <button id="historyToggle" class="history-toggle">
    🕘 Calculation History
  </button>

  <div id="historyPanel" class="history-panel" hidden>
    <div class="history-heading">
      <h3>History</h3>
      <button id="clearHistory">Clear All</button>
    </div>
    <div id="historyList">
      <p>No calculations yet.</p>
    </div>
  </div>
</div>

    <section class="keys" aria-label="Calculator buttons">
      <button class="function" data-action="clear">AC</button>
      <button class="function" data-action="delete">DEL</button>
      <button class="function" data-action="percent">%</button>
      <button class="operator" data-operator="÷">÷</button>

      <button data-number="7">7</button>
      <button data-number="8">8</button>
      <button data-number="9">9</button>
      <button class="operator" data-operator="×">×</button>

      <button data-number="4">4</button>
      <button data-number="5">5</button>
      <button data-number="6">6</button>
      <button class="operator" data-operator="−">−</button>

      <button data-number="1">1</button>
      <button data-number="2">2</button>
      <button data-number="3">3</button>
      <button class="operator" data-operator="+">+</button>

      <button class="function" data-action="sign">+/−</button>
      <button data-number="0">0</button>
      <button data-action="decimal">.</button>
      <button class="equals" data-action="equals">=</button>
    </section>
    <p class="hint">Keyboard supported · Simple and fast</p>
  </main>
  <script src="js/script.js"></script>
</body>
</html>
